[project]
name = "medarchive-backend"
version = "0.1.0"
description = "MedArchive backend — FastAPI + SQLAlchemy 2.0 (async)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncmy>=0.2.10",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "redis[hiredis]>=5.1",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.x несовместим с bcrypt >=4.1: detect_wrap_bug пробует
    # длинный probe-секрет, а bcrypt 4.1+ кидает ValueError вместо
    # silent-truncate, из-за чего любой hash_password() падает с 500.
    "bcrypt>=4.0,<4.1",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "arq>=0.26",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "mnemonic>=0.21",
    "python-multipart>=0.0.9",
    "aiogram>=3.4",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI: Depends() default values are idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
