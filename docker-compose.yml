services:
  mariadb:
    image: mariadb:11
    container_name: medarchive_mariadb
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - medarchive_net

  redis:
    image: redis:7-alpine
    container_name: medarchive_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - medarchive_net

  # ВАЖНО: redis_keys — отдельный инстанс БЕЗ persistence.
  # Хранит DEK пользователей в памяти. При рестарте все ключи теряются
  # и пользователям нужно перелогиниться (см. docs/ENCRYPTION.md).
  # Это безопасное поведение: ключи никогда не уходят на диск,
  # компрометация дампа диска не даст расшифровать медданные.
  redis_keys:
    image: redis:7-alpine
    container_name: medarchive_redis_keys
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory-policy"
      - "noeviction"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - medarchive_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: medarchive_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      REDIS_HOST: redis
      REDIS_KEYS_HOST: redis_keys
      UPLOADS_ROOT: /app/uploads
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_keys:
        condition: service_healthy
    networks:
      - medarchive_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: medarchive_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    networks:
      - medarchive_net

  nginx:
    image: nginx:1.27-alpine
    container_name: medarchive_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - medarchive_net

  telegram_bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: medarchive_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - medarchive_net

  mailer_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: medarchive_mailer_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
    command: ["arq", "app.workers.mailer.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medarchive_net

  # Отдельный Telegram-бот для админа (команды /stats /health /help).
  # Уведомления (новые регистрации/тикеты/ошибки) шлёт сам backend
  # напрямую через httpx в Telegram Bot API — этот сервис нужен только
  # для команд, которые отправляет админ. Если TELEGRAM_ADMIN_BOT_TOKEN
  # пустой — контейнер быстро упадёт с SystemExit; в этом случае его
  # можно просто остановить (`docker compose stop admin_telegram_bot`).
  admin_telegram_bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: medarchive_admin_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      REDIS_HOST: redis
      REDIS_KEYS_HOST: redis_keys
      UPLOADS_ROOT: /app/uploads
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: ["python", "-m", "app.services.admin_telegram.bot"]
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - medarchive_net

volumes:
  mariadb_data:
  redis_data:
  frontend_node_modules:
  backend_uploads:

networks:
  medarchive_net:
    driver: bridge
