upstream medarchive_backend {
    server backend:8000;
}

upstream medarchive_frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;

    # На этапе 0 SSL не настроен — это локальный dev. SSL появится на этапе 12.

    # Заголовки безопасности (расширены на этапе 12 для прод-домена)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API backend
    location /api/ {
        proxy_pass         http://medarchive_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger UI для удобства
    location /docs {
        proxy_pass         http://medarchive_backend/docs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /openapi.json {
        proxy_pass         http://medarchive_backend/openapi.json;
        proxy_set_header   Host              $host;
    }

    # Vite HMR требует WebSocket
    location / {
        proxy_pass         http://medarchive_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
